<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon petit bébé ❤️</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 30%, #ffeaa7 60%, #dfe6e9 100%);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      overflow: hidden;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.8);
      animation: floatParticle linear infinite;
    }

    @keyframes floatParticle {
      0%   { transform: translateY(110vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    h1 {
      position: relative;
      z-index: 2;
      font-size: clamp(1.4rem, 5vw, 2.5rem);
      color: #c0392b;
      text-shadow: 0 2px 8px rgba(255,255,255,0.8);
      margin-bottom: 30px;
      animation: fadeInDown 1.2s ease both;
      text-align: center;
      padding: 0 20px;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .photo-wrapper {
      position: relative;
      z-index: 2;
      animation: floatUpDown 4s ease-in-out infinite, fadeInUp 1.2s ease both 0.3s;
    }

    @keyframes floatUpDown {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-18px); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .photo-wrapper::before {
      content: '';
      position: absolute;
      inset: -12px;
      border-radius: 58% 42% 55% 45% / 48% 52% 48% 52%;
      background: linear-gradient(135deg, #fd79a8, #fdcb6e, #74b9ff, #a29bfe);
      background-size: 300% 300%;
      animation: rotateHalo 6s linear infinite, gradientShift 4s ease infinite;
      z-index: -1;
      filter: blur(4px);
      opacity: 0.85;
    }

    @keyframes rotateHalo {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .photo-wrapper img {
      display: block;
      width: min(80vw, 340px);
      aspect-ratio: 3/4;
      object-fit: cover;
      border-radius: 50% 50% 48% 52% / 52% 50% 50% 48%;
      border: 6px solid white;
      box-shadow:
        0 0 30px rgba(255,180,130,0.7),
        0 0 60px rgba(255,130,100,0.4),
        0 20px 40px rgba(0,0,0,0.2);
      animation: heartbeat 2.5s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14%       { transform: scale(1.04); }
      28%       { transform: scale(0.98); }
      42%       { transform: scale(1.03); }
      70%       { transform: scale(1); }
    }

    .hearts { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
    .heart {
      position: absolute;
      animation: riseHeart linear infinite;
      opacity: 0;
    }

    @keyframes riseHeart {
      0%   { transform: translateY(0) scale(0.6) rotate(-10deg); opacity: 0; }
      15%  { opacity: 0.9; }
      80%  { opacity: 0.5; }
      100% { transform: translateY(-90vh) scale(1.2) rotate(10deg); opacity: 0; }
    }

    p.caption {
      position: relative;
      z-index: 2;
      margin-top: 28px;
      font-size: clamp(1rem, 3.5vw, 1.3rem);
      color: #6c3483;
      letter-spacing: 0.06em;
      text-shadow: 0 1px 6px rgba(255,255,255,0.9);
      animation: fadeInUp 1.2s ease both 0.6s;
      text-align: center;
      padding: 0 20px;
    }

    .star {
      position: absolute;
      animation: twinkle ease-in-out infinite;
      z-index: 3;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: translate(-50%,-50%) scale(0.5); }
      50%       { opacity: 1; transform: translate(-50%,-50%) scale(1.3); }
    }
  </style>
</head>
<body>

  <div class="particles" id="particles"></div>
  <div class="hearts" id="hearts"></div>

  <h1>Mon petit trésor ✨</h1>

  <div class="photo-wrapper" id="photoWrapper">
    <img src="photo.jpg" alt="Mon bébé" />
  </div>

  <p class="caption">Trop beau mon bébé 💕</p>

  <script>
    const container = document.getElementById('particles');
    for (let i = 0; i < 35; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 7 + 3;
      p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;animation-duration:${Math.random()*10+8}s;animation-delay:${Math.random()*10}s;`;
      container.appendChild(p);
    }

    const heartContainer = document.getElementById('hearts');
    const emojis = ['❤️','💕','💖','💗','💓','🌸','✨'];
    for (let i = 0; i < 18; i++) {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      h.style.cssText = `left:${Math.random()*100}%;bottom:0;animation-duration:${Math.random()*6+5}s;animation-delay:${Math.random()*8}s;font-size:${Math.random()*1.5+1}rem;`;
      heartContainer.appendChild(h);
    }

    const wrapper = document.getElementById('photoWrapper');
    const starEmojis = ['⭐','✨','💫','🌟','💥','🌸'];
    for (let i = 0; i < 6; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.textContent = starEmojis[i % starEmojis.length];
      const angle = (i / 6) * 360;
      const r = 54;
      s.style.cssText = `top:${50 + r * Math.sin(angle * Math.PI/180)}%;left:${50 + r * Math.cos(angle * Math.PI/180)}%;animation-duration:${Math.random()*1.5+1}s;animation-delay:${i*0.3}s;font-size:1.2rem;`;
      wrapper.appendChild(s);
    }
  </script>
</body>
</html>
